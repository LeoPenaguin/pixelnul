# Same checks as the Git hooks (web/.husky/), so that a bypassed or missing hook cannot reach main unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml before a release

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server
      - name: Known vulnerabilities (Go version and modules)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Tests, 100 % coverage
        run: |
          go test -race -coverprofile=cover.out ./internal/...
          go tool cover -func=cover.out | tail -1 | grep -q '100.0%'

  web:
    runs-on: ubuntu-latest
    services:
      redis: # for the end-to-end tests (database 14)
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6 # the end-to-end tests start the Go server
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:e2e
