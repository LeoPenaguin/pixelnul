# Keeps a « release vX.Y.Z » pull request up to date from the Conventional Commits merged into main (fix → patch,
# feat → minor, `!` → major), with CHANGELOG.md. Merging it creates the tag and the GitHub Release; the tag starts
# release.yml (CI, build, deploy).
# RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: a tag or pull request made with GITHUB_TOKEN starts no workflow, so neither
# the deploy nor the CI checks required to merge would run.
name: Release Please

on:
  push:
    branches: [main]

permissions: {} # everything goes through RELEASE_PLEASE_TOKEN

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
